name: SCBS preflight safety test

on:
  pull_request:
    branches: [main]
  push:
    branches: [scbs-complete-upgrade-review]

permissions:
  contents: read

jobs:
  preflight-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run read-only preflight safety tests
        run: npm run test:preflight
